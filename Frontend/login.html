<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | AapdaSetu AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/brand.css">
  <script src="assets/config.js"></script>
  <script src="js/api.js"></script>
</head>
<body class="as-hero d-flex align-items-center" style="min-height:100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="text-center mb-4">
          <a href="index.html" class="text-decoration-none text-white fw-bold fs-4">
            <i class="bi bi-shield-check me-2"></i>AapdaSetu AI
          </a>
        </div>
        <div class="as-card p-4 p-md-5 as-fade-in">
          <h3 class="fw-bold mb-1">Welcome back</h3>
          <p class="as-muted mb-4">Sign in to continue your disaster-readiness training.</p>

          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label class="form-label" for="userId">User ID</label>
              <input type="text" class="form-control" id="userId" required autocomplete="username">
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input type="password" class="form-control" id="password" required autocomplete="current-password">
            </div>
            <div id="loginError" class="alert alert-danger py-2 small d-none" role="alert"></div>
            <button type="submit" class="btn btn-as-primary w-100 py-2" id="loginBtn">
              <span id="loginBtnText">Login</span>
            </button>
          </form>
          <p class="text-center small mt-4 mb-0">
            Don't have an account? <a href="register.html">Register</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/toast.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const userId = document.getElementById("userId").value.trim();
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("loginError");
      const btn = document.getElementById("loginBtn");
      const btnText = document.getElementById("loginBtnText");

      errEl.classList.add("d-none");
      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

      const result = await login(userId, password);
      btn.disabled = false;
      btnText.textContent = "Login";

      if (result.ok) {
        showToast("Welcome back!", "success");
        window.location.href = "dashboard.html";
      } else {
        errEl.textContent = result.message || "Invalid user ID or password.";
        errEl.classList.remove("d-none");
      }
    });
  </script>
</body>
</html>
