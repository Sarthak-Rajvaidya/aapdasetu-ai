<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mission | AapdaSetu AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/brand.css">
  <link rel="stylesheet" href="css/simulation.css">
  <script src="assets/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/toast.js" defer></script>
  <script src="js/nav.js" defer></script>
</head>
<body>
<div id="as-navbar-root"></div>

<section class="as-section pt-4">
  <div class="container" style="max-width: 920px;">

    <div id="simLoading" class="as-skeleton" style="height:420px;"></div>
    <div id="simError" class="alert alert-danger d-none"></div>

    <div id="simIntro" class="d-none">
      <div class="as-badge-soft mb-2" id="introCodename"></div>
      <h2 class="fw-bold mb-2" id="introTitle"></h2>
      <p class="as-muted" id="introDescription"></p>
      <div class="as-card p-4 mb-4">
        <h6 class="fw-bold mb-2">Objectives</h6>
        <ul id="introObjectives" class="small mb-0"></ul>
      </div>
      <div class="d-flex gap-3 small as-muted mb-4">
        <span><i class="bi bi-speedometer2 me-1"></i><span id="introDifficulty"></span></span>
        <span><i class="bi bi-clock me-1"></i>~<span id="introDuration"></span> min</span>
      </div>
      <button class="btn btn-as-primary btn-lg" id="beginMissionBtn"><i class="bi bi-play-fill me-1"></i>Begin Mission</button>
    </div>

    <div id="simPlayer" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="as-badge-soft" id="stepCounter">Step 1</span>
        <span class="small as-muted"><i class="bi bi-stopwatch me-1"></i><span id="elapsedTime">00:00</span></span>
      </div>
      <div class="sim-stage mb-4">
        <div>
          <h4 class="fw-bold" id="stepTitle"></h4>
          <p class="mb-0" id="stepNarrative" style="max-width:560px;"></p>
        </div>
      </div>
      <div id="stepOptions" class="d-flex flex-column gap-3"></div>
    </div>

    <div id="simReport" class="d-none">
      <div class="text-center mb-4">
        <div class="as-badge-soft mb-2">MISSION COMPLETE</div>
        <h2 class="fw-bold display-5" id="reportScore">0%</h2>
      </div>
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="as-card p-3 text-center"><div class="fw-bold fs-5" id="reportAccuracy">0%</div><div class="small as-muted">Decision Accuracy</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="as-card p-3 text-center"><div class="fw-bold fs-5" id="reportTime">0%</div><div class="small as-muted">Response Time</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="as-card p-3 text-center"><div class="fw-bold fs-5" id="reportSafety">0%</div><div class="small as-muted">Safety Awareness</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="as-card p-3 text-center"><div class="fw-bold fs-5" id="reportResource">0%</div><div class="small as-muted">Resource Mgmt</div></div>
        </div>
      </div>

      <div id="criticalMistakeBox" class="alert alert-warning d-none">
        <strong>Critical mistake:</strong> <span id="criticalMistakeText"></span>
      </div>

      <div class="as-card p-4 mb-3">
        <h6 class="fw-bold mb-2"><i class="bi bi-stars me-2"></i>AI Feedback</h6>
        <p class="mb-0 small" id="aiFeedbackText"></p>
      </div>

      <div id="recommendedBox" class="as-card p-4 mb-3 d-none">
        <h6 class="fw-bold mb-1">Recommended Training</h6>
        <p class="mb-0 small" id="recommendedText"></p>
      </div>

      <div id="newAchievementsBox" class="mb-4"></div>

      <div class="d-flex gap-3">
        <a href="simulation.html" class="btn btn-as-dark-outline">Back to Simulations</a>
        <a href="dashboard.html" class="btn btn-as-primary">View Dashboard</a>
      </div>
    </div>

  </div>
</section>

<div id="as-footer-root"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/simulation-engine.js"></script>
</body>
</html>
