<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz | AapdaSetu AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/brand.css">
  <script src="assets/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/toast.js" defer></script>
  <script src="js/nav.js" defer></script>
</head>
<body>
<div id="as-navbar-root"></div>

<section class="as-section">
  <div class="container" style="max-width: 760px;">
    <div id="quizLoading" class="as-skeleton" style="height:300px;"></div>

    <div id="quizApp" class="d-none">
      <h2 class="fw-bold mb-1" id="quizTitle">Quiz</h2>
      <p class="as-muted mb-4" id="quizSubtitle"></p>

      <form id="quizForm" class="as-card p-4"></form>

      <div id="quizResultPanel" class="as-card p-4 mt-4 d-none">
        <h4 class="fw-bold mb-3">Results</h4>
        <div class="row g-3 text-center mb-3">
          <div class="col-4"><div class="fs-3 fw-bold" id="resScore">0%</div><div class="small as-muted">Score</div></div>
          <div class="col-4"><div class="fs-3 fw-bold" id="resCorrect">0</div><div class="small as-muted">Correct</div></div>
          <div class="col-4"><div class="fs-3 fw-bold" id="resTotal">0</div><div class="small as-muted">Total</div></div>
        </div>
        <div id="resWeak" class="mb-3"></div>
        <div id="resRecommend" class="alert alert-info d-none"></div>
        <a href="modules.html" class="btn btn-as-dark-outline">Back to Learn</a>
      </div>
    </div>

    <div id="quizError" class="alert alert-danger d-none"></div>
  </div>
</section>

<div id="as-footer-root"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/quiz.js"></script>
</body>
</html>
