<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | AapdaSetu AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/brand.css">
  <script src="assets/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js" defer></script>
  <script src="js/toast.js" defer></script>
  <script src="js/nav.js" defer></script>
</head>
<body>
<div id="as-navbar-root"></div>

<section class="as-section">
  <div class="container">
    <h2 class="fw-bold mb-4">Profile</h2>
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="as-card p-4 text-center">
          <div class="as-icon-tile mx-auto mb-3" style="width:72px;height:72px;font-size:2rem;">
            <i class="bi bi-person"></i>
          </div>
          <h5 class="fw-bold mb-0" id="profileName">—</h5>
          <p class="as-muted small mb-3" id="profileUserId">—</p>
          <span class="as-badge-soft" id="profileRole">—</span>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="as-card p-4 mb-4">
          <h6 class="fw-bold mb-3">Account Details</h6>
          <dl class="row mb-0 small">
            <dt class="col-sm-4">Email</dt><dd class="col-sm-8" id="profileEmail">—</dd>
            <dt class="col-sm-4">Age</dt><dd class="col-sm-8" id="profileAge">—</dd>
            <dt class="col-sm-4">Account created</dt><dd class="col-sm-8" id="profileCreated">—</dd>
          </dl>
        </div>

        <div class="as-card p-4 mb-4">
          <h6 class="fw-bold mb-3">Performance Summary</h6>
          <div class="row g-3 text-center">
            <div class="col-6 col-md-3">
              <div class="fs-4 fw-bold" id="statCourses">0</div>
              <div class="small as-muted">Courses Completed</div>
            </div>
            <div class="col-6 col-md-3">
              <div class="fs-4 fw-bold" id="statSims">0</div>
              <div class="small as-muted">Simulations Completed</div>
            </div>
            <div class="col-6 col-md-3">
              <div class="fs-4 fw-bold" id="statAvgSim">0%</div>
              <div class="small as-muted">Avg Simulation Score</div>
            </div>
            <div class="col-6 col-md-3">
              <div class="fs-4 fw-bold" id="statReadiness">0%</div>
              <div class="small as-muted">Readiness Score</div>
            </div>
          </div>
        </div>

        <div class="as-card p-4">
          <h6 class="fw-bold mb-3">Edit Profile</h6>
          <form id="profileForm" class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" id="editName">
            </div>
            <div class="col-md-6">
              <label class="form-label">Age</label>
              <input type="number" min="0" max="120" class="form-control" id="editAge">
            </div>
            <div class="col-12">
              <button class="btn btn-as-primary" type="submit">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="as-footer-root"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
