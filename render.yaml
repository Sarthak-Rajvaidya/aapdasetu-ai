services:
  - type: web
    name: aapdasetu-ai
    runtime: python
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: cd Backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 120
      - key: DATABASE_URL
        value: sqlite:///./dtms.db
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
